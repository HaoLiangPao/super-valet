name: ci

# ADR-0011：推 claude-version 和开 PR 时跑应用层检查。
# workflow 只需存在于被推的分支里，不依赖 main。
# 不注入任何秘密：缺 Supabase 变量时应用走游客模式，Places/LLM 密钥只在服务端运行时读。
on:
  push:
    branches: [claude-version]
  pull_request:

jobs:
  web:
    name: lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
